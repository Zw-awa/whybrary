name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.verify.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Verify tag matches app versions
        id: verify
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -pe "JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).version")
          TAURI_VERSION=$(node -pe "JSON.parse(require('fs').readFileSync('./src-tauri/tauri.conf.json', 'utf8')).version")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ./src-tauri/Cargo.toml | head -n1)
          EXPECTED_PRERELEASE=false
          if [[ "$TAG_VERSION" == *-* ]]; then
            EXPECTED_PRERELEASE=true
          fi

          echo "tag=$TAG_VERSION"
          echo "package.json=$PACKAGE_VERSION"
          echo "tauri.conf.json=$TAURI_VERSION"
          echo "Cargo.toml=$CARGO_VERSION"
          echo "is_prerelease=$EXPECTED_PRERELEASE" >> "$GITHUB_OUTPUT"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match src-tauri/tauri.conf.json version $TAURI_VERSION"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match src-tauri/Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  publish-tauri:
    needs: verify-version
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle_args: "--bundles dmg --no-sign"
          - platform: ubuntu-22.04
            bundle_args: "--bundles deb,rpm,appimage --no-sign"
          - platform: windows-latest
            bundle_args: "--bundles nsis --no-sign"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Publish direct-download bundles
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Whybrary ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ needs.verify-version.outputs.is_prerelease }}
          releaseCommitish: ${{ github.sha }}
          generateReleaseNotes: true
          includeDebug: false
          includeUpdaterJson: false
          projectPath: .
          args: ${{ matrix.bundle_args }}
          retryAttempts: 2

  publish-android-apk:
    needs:
      - verify-version
      - publish-tauri
    environment:
      name: release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Prefetch Rust dependencies
        shell: pwsh
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        shell: pwsh
        run: |
          sdkmanager `
            --sdk_root="$env:ANDROID_SDK_ROOT" `
            "platform-tools" `
            "platforms;android-36" `
            "build-tools;36.0.0" `
            "ndk;30.0.14904198"

      - name: Normalize Android environment
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            throw "ANDROID_SDK_ROOT is not set after setup-android."
          }
          "ANDROID_HOME=$env:ANDROID_SDK_ROOT" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" >> $env:GITHUB_ENV
          "NDK_HOME=$env:ANDROID_SDK_ROOT\ndk\30.0.14904198" >> $env:GITHUB_ENV

      - name: Decode Android keystore
        shell: pwsh
        run: |
          $keystorePath = "$env:RUNNER_TEMP\whybrary-release.jks"
          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          )
          "ANDROID_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV

      - name: Prepare Android project
        shell: pwsh
        run: npm run android:prepare

      - name: Verify generated Android project
        shell: pwsh
        run: |
          $required = @(
            "src-tauri\gen\android\gradle\wrapper\gradle-wrapper.properties",
            "src-tauri\gen\android\app\build.gradle.kts",
            "src-tauri\gen\android\app\tauri.build.gradle.kts",
            "src-tauri\gen\android\tauri.settings.gradle",
            "src-tauri\gen\android\tauri-android-vendor\build.gradle.kts"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing generated Android file: $path"
            }
          }

      - name: Assert Android version metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauriProps = Get-Content src-tauri/gen/android/app/tauri.properties
          $versionNameLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionName=*' }
          $versionCodeLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionCode=*' }

          if (-not $versionNameLine) {
            throw "Missing tauri.android.versionName in tauri.properties"
          }
          if (-not $versionCodeLine) {
            throw "Missing tauri.android.versionCode in tauri.properties"
          }

          $versionName = $versionNameLine.Split('=', 2)[1]
          $versionCode = [int]$versionCodeLine.Split('=', 2)[1]

          if ($versionName -ne $package.version) {
            throw "Android versionName $versionName does not match package.json version $($package.version)"
          }

          if ($package.version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-rc(\d+))?$') {
            throw "Unsupported version format for Android versioning: $($package.version)"
          }

          $expectedVersionCode = ([int]$matches[1] * 1000000) + ([int]$matches[2] * 10000) + ([int]$matches[3] * 100) + $(if ($matches[4]) { [int]$matches[4] } else { 99 })
          if ($versionCode -ne $expectedVersionCode) {
            throw "Android versionCode $versionCode does not match expected value $expectedVersionCode for $($package.version)"
          }

      - name: Assert patched Android files are BOM-free
        shell: pwsh
        run: |
          $paths = @(
            "src-tauri\gen\android\tauri.settings.gradle",
            "src-tauri\gen\android\app\tauri.properties"
          )
          foreach ($path in $paths) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "Patched Android file still contains UTF-8 BOM: $path"
            }
          }

      - name: Print Android build context
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauriProps = Get-Content src-tauri/gen/android/app/tauri.properties
          $rootGradle = Get-Content src-tauri/gen/android/build.gradle.kts
          $buildSrcGradle = Get-Content src-tauri/gen/android/buildSrc/build.gradle.kts
          $tauriSettings = Get-Content src-tauri/gen/android/tauri.settings.gradle

          $versionNameLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionName=*' } | Select-Object -First 1
          $versionCodeLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionCode=*' } | Select-Object -First 1

          $rootRepoStart = ($rootGradle | Select-String -Pattern 'repositories \{' | Select-Object -First 1).LineNumber
          $buildSrcRepoStart = ($buildSrcGradle | Select-String -Pattern 'repositories \{' | Select-Object -First 1).LineNumber

          Write-Output "package.json version: $($package.version)"
          Write-Output $versionNameLine
          Write-Output $versionCodeLine
          Write-Output "tauri.build.gradle.kts exists: $(Test-Path 'src-tauri/gen/android/app/tauri.build.gradle.kts')"
          Write-Output "root TauriActivity.kt exists: $(Test-Path 'src-tauri/gen/android/app/src/main/java/io/github/zwawa/whybrary/TauriActivity.kt')"
          Write-Output "generated TauriActivity.kt exists: $(Test-Path 'src-tauri/gen/android/app/src/main/java/io/github/zwawa/whybrary/generated/TauriActivity.kt')"
          Write-Output "root Rust.kt exists: $(Test-Path 'src-tauri/gen/android/app/src/main/java/io/github/zwawa/whybrary/Rust.kt')"
          Write-Output "generated Rust.kt exists: $(Test-Path 'src-tauri/gen/android/app/src/main/java/io/github/zwawa/whybrary/generated/Rust.kt')"
          Write-Output "tauri.settings.gradle BOM-free: true"
          Write-Output "root build.gradle.kts repositories start line: $rootRepoStart"
          Write-Output "buildSrc build.gradle.kts repositories start line: $buildSrcRepoStart"
          Write-Output 'tauri.settings.gradle:'
          Get-Content src-tauri/gen/android/tauri.settings.gradle
          Write-Output 'app/tauri.build.gradle.kts:'
          Get-Content src-tauri/gen/android/app/tauri.build.gradle.kts

      - name: Build unsigned Android APK
        shell: pwsh
        env:
          WHYBRARY_ANDROID_GRADLE_LOG_LEVEL: info
        run: npm run android:build:apk

      - name: Print Android failure summary
        if: failure()
        shell: pwsh
        run: |
          $logFiles = @(
            "src-tauri\gen\android\app\build\outputs\logs\manifest-merger-arm64-release-report.txt",
            "src-tauri\gen\android\build\reports\problems\problems-report.html"
          ) | Where-Object { Test-Path $_ }
          foreach ($path in $logFiles) {
            Write-Output "===== $path ====="
            Get-Content $path | Select-String -Pattern '(^e: )|(FAILURE:)|(Execution failed for task)|(Unresolved reference)|(Redeclaration)|(Could not read script)|(Could not resolve all artifacts)' -Context 0,2
          }

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-diagnostics
          path: |
            src-tauri/gen/android/build/reports
            src-tauri/gen/android/app/build/reports
            src-tauri/gen/android/app/build/outputs/logs
            src-tauri/gen/android/tauri.settings.gradle
            src-tauri/gen/android/app/build.gradle.kts
            src-tauri/gen/android/app/tauri.build.gradle.kts
            src-tauri/gen/android/app/tauri.properties
            src-tauri/gen/android/build.gradle.kts
            src-tauri/gen/android/buildSrc/build.gradle.kts

      - name: Sign Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:sign:apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whybrary-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/release/whybrary-*-arm64-release.apk

      - name: Upload signed APK to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $apk = Get-ChildItem "src-tauri\gen\android\app\build\outputs\apk\arm64\release\whybrary-*-arm64-release.apk" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $apk) {
            throw "Signed APK not found."
          }

          gh release upload "${{ github.ref_name }}" $apk.FullName --clobber
