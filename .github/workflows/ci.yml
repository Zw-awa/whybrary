name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  tauri-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        working-directory: src-tauri
        run: cargo check --tests

      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test --lib

  tauri-smoke-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tauri smoke
        env:
          WHYBRARY_TAURI_SMOKE: "1"
          WHYBRARY_APP_DATA_DIR: ${{ github.workspace }}/src-tauri/target/ci-smoke/whybrary
        run: xvfb-run -a cargo run --manifest-path src-tauri/Cargo.toml

      - name: Assert smoke report and sqlite file
        shell: bash
        env:
          SMOKE_DIR: ${{ github.workspace }}/src-tauri/target/ci-smoke/whybrary
        run: |
          set -euo pipefail

          REPORT_PATH="$SMOKE_DIR/smoke-report.json"
          DB_PATH="$SMOKE_DIR/whybrary.sqlite3"

          test -f "$REPORT_PATH"
          test -f "$DB_PATH"

          cat "$REPORT_PATH"
          grep -q '"success": true' "$REPORT_PATH"

  android-checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Prefetch Rust dependencies
        shell: pwsh
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        shell: pwsh
        run: |
          sdkmanager `
            --sdk_root="$env:ANDROID_SDK_ROOT" `
            "platform-tools" `
            "platforms;android-36" `
            "build-tools;36.0.0" `
            "ndk;30.0.14904198"

      - name: Normalize Android environment
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            throw "ANDROID_SDK_ROOT is not set after setup-android."
          }
          "ANDROID_HOME=$env:ANDROID_SDK_ROOT" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" >> $env:GITHUB_ENV
          "NDK_HOME=$env:ANDROID_SDK_ROOT\ndk\30.0.14904198" >> $env:GITHUB_ENV

      - name: Prepare Android project
        shell: pwsh
        run: npm run android:prepare

      - name: Assert Android version metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauriProps = Get-Content src-tauri/gen/android/app/tauri.properties
          $versionNameLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionName=*' }
          $versionCodeLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionCode=*' }
          if (-not $versionNameLine) {
            throw "Missing tauri.android.versionName in tauri.properties"
          }
          if (-not $versionCodeLine) {
            throw "Missing tauri.android.versionCode in tauri.properties"
          }

          $versionName = $versionNameLine.Split('=', 2)[1]
          $versionCode = [int]$versionCodeLine.Split('=', 2)[1]
          if ($versionName -ne $package.version) {
            throw "Android versionName $versionName does not match package.json version $($package.version)"
          }

          if ($package.version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-rc(\d+))?$') {
            throw "Unsupported version format for Android versioning: $($package.version)"
          }

          $expectedVersionCode = ([int]$matches[1] * 1000000) + ([int]$matches[2] * 10000) + ([int]$matches[3] * 100) + $(if ($matches[4]) { [int]$matches[4] } else { 99 })
          if ($versionCode -ne $expectedVersionCode) {
            throw "Android versionCode $versionCode does not match expected value $expectedVersionCode for $($package.version)"
          }

      - name: Verify generated Android project
        shell: pwsh
        run: |
          $required = @(
            "src-tauri\gen\android\gradle\wrapper\gradle-wrapper.properties",
            "src-tauri\gen\android\app\build.gradle.kts",
            "src-tauri\gen\android\app\tauri.build.gradle.kts",
            "src-tauri\gen\android\tauri.settings.gradle",
            "src-tauri\gen\android\tauri-android-vendor\build.gradle.kts"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing generated Android file: $path"
            }
          }

      - name: Assert patched Android files are BOM-free
        shell: pwsh
        run: |
          $paths = @(
            "src-tauri\gen\android\tauri.settings.gradle",
            "src-tauri\gen\android\app\tauri.properties"
          )
          foreach ($path in $paths) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "Patched Android file still contains UTF-8 BOM: $path"
            }
          }

      - name: Print Android build context
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauriProps = Get-Content src-tauri/gen/android/app/tauri.properties
          $rootGradle = Get-Content src-tauri/gen/android/build.gradle.kts
          $buildSrcGradle = Get-Content src-tauri/gen/android/buildSrc/build.gradle.kts
          $tauriSettings = Get-Content src-tauri/gen/android/tauri.settings.gradle

          $versionNameLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionName=*' } | Select-Object -First 1
          $versionCodeLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionCode=*' } | Select-Object -First 1

          $rootRepoStart = ($rootGradle | Select-String -Pattern 'repositories \{' | Select-Object -First 1).LineNumber
          $buildSrcRepoStart = ($buildSrcGradle | Select-String -Pattern 'repositories \{' | Select-Object -First 1).LineNumber

          Write-Output "package.json version: $($package.version)"
          Write-Output $versionNameLine
          Write-Output $versionCodeLine
          Write-Output "tauri.build.gradle.kts exists: $(Test-Path 'src-tauri/gen/android/app/tauri.build.gradle.kts')"
          Write-Output "root TauriActivity.kt exists: $(Test-Path 'src-tauri/gen/android/app/src/main/java/io/github/zwawa/whybrary/TauriActivity.kt')"
          Write-Output "generated TauriActivity.kt exists: $(Test-Path 'src-tauri/gen/android/app/src/main/java/io/github/zwawa/whybrary/generated/TauriActivity.kt')"
          Write-Output "tauri.settings.gradle BOM-free: true"
          Write-Output "root build.gradle.kts repositories start line: $rootRepoStart"
          Write-Output "buildSrc build.gradle.kts repositories start line: $buildSrcRepoStart"
          Write-Output 'tauri.settings.gradle:'
          Get-Content src-tauri/gen/android/tauri.settings.gradle
          Write-Output 'app/tauri.build.gradle.kts:'
          Get-Content src-tauri/gen/android/app/tauri.build.gradle.kts

      - name: Build unsigned Android APK
        shell: pwsh
        env:
          WHYBRARY_ANDROID_GRADLE_LOG_LEVEL: info
        run: npm run android:build:apk

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks-diagnostics
          path: |
            src-tauri/gen/android/build/reports
            src-tauri/gen/android/app/build/reports
            src-tauri/gen/android/app/build/outputs/logs
            src-tauri/gen/android/tauri.settings.gradle
            src-tauri/gen/android/app/build.gradle.kts
            src-tauri/gen/android/app/tauri.build.gradle.kts
            src-tauri/gen/android/app/tauri.properties
            src-tauri/gen/android/build.gradle.kts
            src-tauri/gen/android/buildSrc/build.gradle.kts
