name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  tauri-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        working-directory: src-tauri
        run: cargo check --tests

      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test --lib

  tauri-smoke-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tauri smoke
        env:
          WHYBRARY_TAURI_SMOKE: "1"
          WHYBRARY_APP_DATA_DIR: ${{ github.workspace }}/src-tauri/target/ci-smoke/whybrary
        run: xvfb-run -a cargo run --manifest-path src-tauri/Cargo.toml

      - name: Assert smoke report and sqlite file
        shell: bash
        env:
          SMOKE_DIR: ${{ github.workspace }}/src-tauri/target/ci-smoke/whybrary
        run: |
          set -euo pipefail

          REPORT_PATH="$SMOKE_DIR/smoke-report.json"
          DB_PATH="$SMOKE_DIR/whybrary.sqlite3"

          test -f "$REPORT_PATH"
          test -f "$DB_PATH"

          cat "$REPORT_PATH"
          grep -q '"success": true' "$REPORT_PATH"

  android-checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Prefetch Rust dependencies
        shell: pwsh
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        shell: pwsh
        run: |
          sdkmanager `
            --sdk_root="$env:ANDROID_SDK_ROOT" `
            "platform-tools" `
            "platforms;android-36" `
            "build-tools;36.0.0" `
            "ndk;30.0.14904198"

      - name: Normalize Android environment
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            throw "ANDROID_SDK_ROOT is not set after setup-android."
          }
          "ANDROID_HOME=$env:ANDROID_SDK_ROOT" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" >> $env:GITHUB_ENV
          "NDK_HOME=$env:ANDROID_SDK_ROOT\ndk\30.0.14904198" >> $env:GITHUB_ENV

      - name: Prepare Android project
        shell: pwsh
        run: npm run android:prepare

      - name: Assert Android version metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauriProps = Get-Content src-tauri/gen/android/app/tauri.properties
          $versionLine = $tauriProps | Where-Object { $_ -like 'tauri.android.versionName=*' }
          if (-not $versionLine) {
            throw "Missing tauri.android.versionName in tauri.properties"
          }
          $versionName = $versionLine.Split('=')[1]
          if ($versionName -ne $package.version) {
            throw "Android versionName $versionName does not match package.json version $($package.version)"
          }

      - name: Build unsigned Android APK
        shell: pwsh
        run: npm run android:build:apk
