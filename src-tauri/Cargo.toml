[package]
name = "whybrary"
version = "0.3.0"
description = "Local-first personal why manager with a neuron-style graph and lightweight To-Do lists."
authors = ["Zw-awa"]
edition = "2021"

[lib]
name = "whybrary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[package.metadata]
